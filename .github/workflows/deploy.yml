name: Deploy

# Builds the site and deploys it to Cloudflare (wrangler.jsonc). Deploys are free and unlimited,
# so the wait below is only there to let a burst of CMS commits (one per action) finish first
# and land as one deploy. Each push restarts the wait.
#
# "Clean photos" pushes its fixes with the workflow token, which doesn't start this workflow,
# so this also runs after it finishes. Every run builds the latest master, not the commit that
# started it. Run it by hand ("Run workflow") to deploy right away.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and
# CLOUDFLARE_ACCOUNT_ID. See the README, "Cloudflare (hosting)".
on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Clean photos]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  WAIT_SECONDS: 120

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for pushes to stop
        if: github.event_name == 'push'
        run: sleep "$WAIT_SECONDS"
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Astro keeps the resized photos here; reusing them skips re-encoding every photo each build
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ github.run_id }}
          restore-keys: astro-images-
      - run: npm run build
        env:
          URL: https://andzius.lt
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
