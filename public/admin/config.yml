# Decap CMS config — https://decapcms.org/docs/configuration-options/
#
# Auth: production logins go through DecapBridge (email/password, Google or
# Microsoft; no GitHub account needed). The backend block is the one DecapBridge
# generated for the site; see the README, "Production editing". The repo and branch
# must match the site's settings in the DecapBridge dashboard. For local editing
# without any of that, `local_backend: true` lets you run `npx decap-server`
# alongside `npm run dev` and edit content directly on disk.
backend:
  name: git-gateway
  repo: PijusRan/ad-portfolio
  branch: master
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/eb3a78d5-ce77-4ddb-8ff4-6598e4b05336/pkce
  auth_token_endpoint: /sites/eb3a78d5-ce77-4ddb-8ff4-6598e4b05336/token
  gateway_url: https://gateway.decapbridge.com

  # Commits show who made the edit
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Fields read from the PKCE login (Google/Microsoft/password)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Adds a "view site" link in the CMS
site_url: https://justas-andzius.netlify.app

local_backend: true

# One shared photo library: the Media tab, the gallery cover picker and the gallery
# photo picker all use src/assets/uploads, and uploads from any of them land there.
# Galleries store paths like `~/assets/uploads/photo.jpg` (the `~` alias is set in
# tsconfig.json), which Astro resolves and optimises at build time via astro:assets.
media_folder: src/assets/uploads
public_folder: ~/assets/uploads


publish_mode: simple

collections:
  - name: settings
    label: Pages
    files:
      - name: hero
        label: Hero
        file: src/content/hero/index.md
        description: 'The two photos behind the title on the home page.'
        media_folder: /src/assets/uploads
        public_folder: ~/assets/uploads
        fields:
          - label: Images
            name: images
            widget: image-list
            hint: >-
              Click "Add images", tick as many as you like in the library (or upload new ones
              there first, several at once), then "Add selected". Use ‹ › to reorder — keep at
              least 2. #1 fills the large photo (top right), #2 the small one (bottom left).
              With rotation on, extra images take over the same two spots in pairs (#3+#4, then
              #5+#6, and so on).
          - label: Rotate through images (experimental)
            name: rotate
            widget: boolean
            default: false
            hint: 'Only takes effect with more than 2 images above. Slowly crossfades between them.'
          - label: Rotation interval (seconds)
            name: interval
            widget: number
            value_type: int
            min: 3
            default: 6
            hint: 'Only used when rotation is on.'
      - name: about
        label: Apie mane
        file: src/content/about/index.md
        description: 'The photo and text on the About page.'
        media_folder: /src/assets/uploads
        public_folder: ~/assets/uploads
        fields:
          - { label: Image, name: image, widget: image, allow_multiple: false, hint: 'Pick one from the library, or upload a new one there.' }
          - { label: Crop, name: focal, widget: string, default: '50% 50%', hint: 'Which part of the photo stays visible when cropped, as "x% y%". 50% 50% is the centre; use a higher second number to show more of the bottom.' }
          - { label: Alt text, name: alt, widget: string, required: false, hint: 'Describes the photo for screen readers and search engines.' }
          - { label: Text, name: body, widget: markdown, buttons: [bold, italic, link], editor_components: [], hint: 'Leave an empty line between paragraphs.' }

  - name: galleries
    label: Galleries
    label_singular: Gallery
    description: Each gallery is one project. The cover appears on the home page and the work page.
    folder: src/content/galleries
    create: true
    path: '{{slug}}/index'
    media_folder: /src/assets/uploads
    public_folder: ~/assets/uploads
    slug: '{{slug}}'
    summary: '{{title}} · order {{order}}'
    thumbnail: coverImage
    sortable_fields: ['order', 'title']
    fields:
      - { label: Title, name: title, widget: string, hint: 'Internal name, e.g. "acne studios 2024 autumn/fall".' }
      - label: Cover image
        name: coverImage
        widget: image
        allow_multiple: false
        hint: Shown on the home page grid and the work page. Pick one from the library, or upload new ones there.
      - label: Photos
        name: photos
        widget: photo-list
        required: false
        hint: 'Click "Add photos", tick as many as you like in the library (or upload new ones there first, several at once), then "Add selected".'
      - { label: Order, name: order, widget: number, value_type: int, min: 0, default: 0, hint: 'Lower numbers come first on the home and work pages.' }
      - { label: Brand, name: brand, widget: string, required: false, hint: 'Work page title, first line (e.g. "acne studios").' }
      - { label: Season, name: season, widget: string, required: false, hint: 'Work page title, second line (e.g. "2024 autumn/fall").' }
      - label: Work page layout
        name: layout
        widget: select
        default: image-right
        options:
          - { label: Image on the right, value: image-right }
          - { label: Image on the left, value: image-left }
          - { label: Full width, value: full }
          - { label: Narrow image on the left, value: narrow-left }
          - { label: Narrow image on the right, value: narrow-right }
        hint: How this project is laid out on the work page.
      - { label: Cover crop, name: focal, widget: string, default: '50% 50%', required: false, hint: 'Which part of the cover stays visible when cropped, as "x% y%". 50% 50% is the centre; use a higher second number to show more of the bottom.' }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Story, name: body, widget: markdown, required: false }
