# Decap CMS config — https://decapcms.org/docs/configuration-options/
#
# Auth: this uses the "github" backend, which needs an OAuth app + a small
# OAuth proxy (Vercel doesn't provide one built-in, unlike Netlify). See the
# README for the two-step setup. For local editing without any of that,
# `local_backend: true` lets you run `npx decap-server` alongside `npm run dev`
# and edit content directly on disk.
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/andzius-portfolio # TODO: replace with the real repo
  branch: main

local_backend: true

# Images are uploaded straight to Cloudinary from the CMS UI. Replace these
# with your own values (see README > Cloudinary setup). The unsigned upload
# preset must be created in your Cloudinary dashboard first.
media_library:
  name: cloudinary
  config:
    cloud_name: YOUR_CLOUDINARY_CLOUD_NAME
    api_key: YOUR_CLOUDINARY_API_KEY
    output_filename_only: true

publish_mode: simple

collections:
  - name: galleries
    label: Galleries
    label_singular: Gallery
    folder: src/content/galleries
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - label: Cover Image
        name: coverImage
        widget: image
        media_library: { config: { output_filename_only: true } }
        hint: Shown on the homepage gallery grid.
      - { label: Order, name: order, widget: number, default: 0, hint: Lower numbers appear first on the homepage. }
      - label: Photos
        name: photos
        widget: list
        summary: '{{fields.alt}}'
        fields:
          - label: Photo
            name: publicId
            widget: image
            media_library: { config: { output_filename_only: true } }
          - { label: Alt text, name: alt, widget: string, hint: Describe the photo for accessibility and SEO. }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Story (optional), name: body, widget: markdown, required: false }
